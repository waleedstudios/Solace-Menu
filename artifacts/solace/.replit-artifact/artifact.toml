kind = "web"
previewPath = "/"
title = "Solace Restaurant OS"
description = "Restaurant operations app for managing ingredient costs, recipes, menu items, invoices, sales, team access, and public nutrition-forward menus."
version = "1.0.0"
id = "artifacts/solace"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18287

[services.development]
run = "pnpm --filter @workspace/solace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/solace", "run", "build" ]
serve = "static"
publicDir = "artifacts/solace/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18287"
BASE_PATH = "/"
