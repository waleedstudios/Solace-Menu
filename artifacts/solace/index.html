<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Restaurant menu management with automatic, standardized macro calculations. Build recipes, share clean public menus." />

    <meta property="og:title" content="Solace Menu — Accurate macros for every menu item" />

  </head>

  <body>
    <script>
      (function () {
        try {
          var s = localStorage.getItem('solace-theme');
          var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (d) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="%BASE_URL%src/main.tsx"></script>
  </body>
</html>
