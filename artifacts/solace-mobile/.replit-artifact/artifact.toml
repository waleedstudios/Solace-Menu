kind = "mobile"
previewPath = "/solace-mobile/"
title = "SolaceMenu Mobile"
description = "Native SolaceMenu app for customers discovering nutrition-forward restaurant menus and owners or staff managing recipes, ingredient costs, menu visibility, and invoices using the existing shared backend."
version = "1.0.0"
id = "artifacts/solace-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/solace-mobile/" ]
localPort = 21939

[services.development]
run = "pnpm --filter @workspace/solace-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/solace-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/solace-mobile", "run", "serve" ]

[services.env]
PORT = "21939"
BASE_PATH = "/solace-mobile/"
