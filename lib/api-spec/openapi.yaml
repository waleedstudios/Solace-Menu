openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /invoices/{invoiceId}/approve:
    post:
      operationId: approveSupplierInvoice
      summary: Atomically approve a reviewed invoice and update shared ingredient prices
      parameters:
        - in: path
          name: invoiceId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceApprovalInput"
      responses:
        "200":
          description: Approved, or already approved on an earlier attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceApprovalResult"
        "400":
          description: Invalid invoice ID or approval input
        "401":
          description: Sign in first
        "403":
          description: Owner or manager required
        "404":
          description: Invoice not found
        "409":
          description: Invoice is not ready for approval
        "422":
          description: Correct invoice validation errors before approval
  /invoices/{invoiceId}/extract:
    post:
      operationId: extractSupplierInvoice
      summary: Read private invoice documents and atomically save extracted lines with match suggestions
      parameters:
        - in: path
          name: invoiceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Ready for review
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [review] }
        "400":
          description: Invalid invoice or missing documents
        "401":
          description: Sign in first
        "403":
          description: Owner or manager required
        "404":
          description: Invoice not found
        "409":
          description: Approved or extraction already in progress
        "422":
          description: Nothing could be extracted
        "429":
          description: AI is busy
        "502":
          description: Extraction failed and may be retried
  /public/restaurants:
    get:
      operationId: discoverRestaurants
      summary: Find restaurants with published menus, without exposing private business records
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Public restaurant directory
          content:
            application/json:
              schema:
                type: object
                required: [restaurants]
                properties:
                  restaurants:
                    type: array
                    items:
                      type: object
                      required: [name, slug, item_count]
                      properties:
                        name: { type: string }
                        slug: { type: string }
                        item_count: { type: integer }
  /account:
    delete:
      operationId: deleteAccount
      summary: Permanently delete the signed-in account and its owned businesses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionRequest"
      responses:
        "200":
          description: Account deleted or durably queued for deletion
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [deleted, pending] }
        "401":
          description: Sign in first
        "403":
          description: Recent sign-in required
  /public-menu/{slug}:
    get:
      operationId: getPublicMenu
      summary: Public dishes and live per-serving nutrition only
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Public menu without private costing data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMenu"
        "404":
          description: Menu not found
  /restaurants/{restaurantId}/menu:
    get:
      operationId: getRestaurantMenu
      summary: Unified recipe and legacy menu view for restaurant members
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Restaurant menu including hidden entries and edit permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantMenu"
        "401":
          description: Not signed in
        "403":
          description: Not a restaurant member
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getCurrentUser
      summary: Resolve the signed-in Clerk account to its local app identity
      responses:
        "200":
          description: Local account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalUser"
        "401":
          description: Not signed in
  /onboarding:
    post:
      operationId: completeBusinessOnboarding
      summary: Save the signed-in user's business details before dashboard access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessDetails"
      responses:
        "200":
          description: Business setup completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalUser"
        "400":
          description: Invalid business details
        "401":
          description: Not signed in
  /data/query:
    post:
      operationId: queryData
      summary: Query or mutate the restaurant data used by the imported app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataRequest"
      responses:
        "200":
          description: Query result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataResult"
        "400":
          description: Invalid query
        "401":
          description: Not signed in
        "403":
          description: Not authorized for this restaurant
  /data/rpc:
    post:
      operationId: callDataFunction
      summary: Publish a public menu or add an existing account to a restaurant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FunctionInput"
      responses:
        "200":
          description: Function result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataResult"
        "400":
          description: Invalid request
        "403":
          description: Forbidden
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      summary: Request a private restaurant document upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadInput"
      responses:
        "200":
          description: Upload destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadDestination"
        "401":
          description: Not signed in
        "403":
          description: Forbidden
  /storage/uploads/complete:
    post:
      operationId: completeUpload
      summary: Confirm an uploaded document exists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "200":
          description: Upload complete
        "404":
          description: File missing
  /storage/documents/url:
    post:
      operationId: getDocumentUrl
      summary: Get an authenticated browser URL for a restaurant document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "200":
          description: Document URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentUrl"
        "403":
          description: Forbidden
  /storage/documents/remove:
    post:
      operationId: removeDocuments
      summary: Remove private restaurant documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentsInput"
      responses:
        "200":
          description: Removed
        "403":
          description: Forbidden
  /storage/documents/{fileId}:
    get:
      operationId: getDocument
      summary: Stream a private restaurant document
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Document content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403":
          description: Forbidden
        "404":
          description: Missing document
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicStorageObject
      summary: Stream a public App Storage asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Asset content
        "404":
          description: Missing asset
  /extract-document:
    post:
      operationId: extractDocument
      summary: Extract the printed contents of invoices, menus, and nutrition labels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractionInput"
      responses:
        "200":
          description: Extracted record, with uncertainty preserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionResult"
        "400":
          description: Invalid document request
        "403":
          description: Forbidden
        "429":
          description: AI temporarily unavailable
components:
  schemas:
    InvoiceApprovalInput:
      type: object
      properties:
        accept_total_mismatch: { type: boolean, default: false }
    InvoiceApprovalResult:
      type: object
      required: [already_approved, changes]
      properties:
        already_approved: { type: boolean }
        changes:
          type: array
          items:
            type: object
            required: [ingredient_id, prev, next, becameCurrent]
            properties:
              ingredient_id: { type: string, format: uuid }
              prev: { type: [number, "null"] }
              next: { type: [number, "null"] }
              becameCurrent: { type: boolean }
    AccountDeletionRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation: { type: string, enum: [DELETE] }
    MenuNutrition:
      type: object
      required: [calories, protein, carbs, fats]
      properties:
        calories: { type: number, minimum: 0 }
        protein: { type: number, minimum: 0 }
        carbs: { type: number, minimum: 0 }
        fats: { type: number, minimum: 0 }
    PublicMenuItem:
      type: object
      required: [id, source, name, description, category, image_url, selling_price, serving_size_text, macros, nutrition_complete, estimated_nutrition, ingredient_count]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [recipe, legacy] }
        name: { type: string }
        description: { type: [string, "null"] }
        category: { type: [string, "null"] }
        image_url: { type: [string, "null"] }
        selling_price: { type: [number, "null"] }
        serving_size_text: { type: [string, "null"] }
        macros:
          anyOf:
            - $ref: "#/components/schemas/MenuNutrition"
            - type: "null"
        nutrition_complete: { type: boolean }
        estimated_nutrition: { type: boolean }
        ingredient_count: { type: integer, minimum: 0 }
    ManagedMenuItem:
      allOf:
        - $ref: "#/components/schemas/PublicMenuItem"
        - type: object
          required: [is_published, can_edit]
          properties:
            is_published: { type: boolean }
            can_edit: { type: boolean }
    PublicMenu:
      type: object
      required: [restaurant_name, slug, items]
      properties:
        restaurant_name: { type: string }
        slug: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/PublicMenuItem" }
    RestaurantMenu:
      type: object
      required: [restaurant_name, slug, items]
      properties:
        restaurant_name: { type: string }
        slug: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/ManagedMenuItem" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LocalUser:
      type: object
      required: [id, email, full_name, onboarding_complete, business_name, business_address, business_phone]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        full_name: { type: string, nullable: true }
        onboarding_complete: { type: boolean }
        business_name: { type: string, nullable: true }
        business_address: { type: string, nullable: true }
        business_phone: { type: string, nullable: true }
    BusinessDetails:
      type: object
      required: [full_name, email, business_name, business_address, business_phone]
      properties:
        full_name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        business_name: { type: string, minLength: 2, maxLength: 120 }
        business_address: { type: string, minLength: 5, maxLength: 500 }
        business_phone: { type: string, minLength: 7, maxLength: 40 }
    DataRequest:
      type: object
      required: [table, operation]
      properties:
        table:
          type: string
          enum: [profiles, restaurants, restaurant_members, locations, ingredients, ingredient_aliases, portion_units, menu_items, recipe_items, recipes, recipe_lines, recipe_versions, invoices, invoice_lines, price_history, sales_imports, sales_lines, sales_mappings, vendors]
        operation:
          type: string
          enum: [select, insert, update, delete, upsert]
        selection: { type: string, maxLength: 1000 }
        filters:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/DataFilter"
        orders:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/DataOrder"
        limit: { type: integer, minimum: 1, maximum: 20000 }
        single: { type: string, enum: [single, maybeSingle] }
        payload: {}
        onConflict: { type: string }
    DataFilter:
      type: object
      required: [column, operator, value]
      properties:
        column: { type: string }
        operator: { type: string, enum: [eq, neq, in] }
        value: {}
    DataOrder:
      type: object
      required: [column]
      properties:
        column: { type: string }
        ascending: { type: boolean }
        nullsFirst: { type: boolean }
    DataResult:
      type: object
      required: [data, error]
      properties:
        data: {}
        error:
          type: [object, "null"]
          properties:
            message: { type: string }
    FunctionInput:
      type: object
      required: [name, args]
      properties:
        name: { type: string, enum: [get_public_menu, add_member_by_email] }
        args: { type: object, additionalProperties: true }
    UploadInput:
      type: object
      required: [logicalPath, name, size, contentType]
      properties:
        logicalPath: { type: string, minLength: 1, maxLength: 500 }
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 20971520 }
        contentType: { type: string, enum: [application/pdf, image/jpeg, image/png, image/webp] }
    UploadDestination:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
    DocumentInput:
      type: object
      required: [path]
      properties:
        path: { type: string, minLength: 1, maxLength: 500 }
    DocumentsInput:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 500 }
    DocumentUrl:
      type: object
      required: [signedUrl]
      properties:
        signedUrl: { type: string }
    ExtractionInput:
      type: object
      required: [kind, restaurant_id, paths]
      properties:
        kind: { type: string, enum: [invoice, label, menu] }
        restaurant_id: { type: string, format: uuid }
        paths:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, maxLength: 500 }
    ExtractionResult:
      type: object
      required: [data]
      properties:
        data: { type: object, additionalProperties: true }

